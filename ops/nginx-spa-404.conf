# Fix soft-404s: unknown URLs currently return HTTP 200 with the SPA shell,
# which Google flags as "Soft 404" and wastes crawl budget.
#
# Drop these location blocks INSIDE the existing `server { ... }` block for
# leadzap.com.my (usually /etc/nginx/sites-enabled/leadzap or conf.d/*.conf),
# replacing any existing `location /` / try_files lines. Adjust `root` to the
# actual deploy path of dist/.
#
# How it works:
#   * Every PUBLIC page is prerendered to a real file by `npm run build`
#     (e.g. /sem/index.html), so it is served directly with 200.
#   * PRIVATE app routes (dashboard, auth, client portal, ...) have no file;
#     they get the noindex 404.html shell with HTTP 200 so the React app still
#     boots and renders them client-side.
#   * Anything else (typos, deleted pages, probe URLs) returns a REAL HTTP 404
#     with the noindex 404.html shell — React renders the friendly NotFound page.
#
# After `nginx -t && systemctl reload nginx`, verify:
#   curl -s -o /dev/null -w "%{http_code}\n" https://leadzap.com.my/no-such-page/   # -> 404
#   curl -s -o /dev/null -w "%{http_code}\n" https://leadzap.com.my/dashboard       # -> 200
#   curl -s -o /dev/null -w "%{http_code}\n" https://leadzap.com.my/sem/            # -> 200

    # Old blog slugs that were indexed before the URL scheme changed — 301 to
    # the current posts so link equity and bookmarks carry over.
    location = /blog/DigitalMarketingInMalaysia/ {
        return 301 /blog/digital-marketing-in-malaysia/;
    }
    location = /blog/digitalmarketingmalaysia/ {
        return 301 /blog/digital-marketing-in-malaysia/;
    }
    location = /blog/HowDigitalMarketingAgencyWorkswithClients/ {
        return 301 /blog/how-digital-marketing-agency-works-with-clients/;
    }

    # Hashed build assets: long cache, and a missing file is a hard 404
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Private client-side app routes: serve the noindex shell with 200
    location ~ ^/(admins|auth|tool|dashboard|proposal|sign|signed|client|settings|invoices|contracts|business-card)(/|$) {
        try_files $uri $uri/index.html /404.html;
    }

    # Public pages: prerendered file or a real 404
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
