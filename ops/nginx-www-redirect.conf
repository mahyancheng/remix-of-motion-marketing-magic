# www.leadzap.com.my -> https://leadzap.com.my (301), preserving the full path.
# Drop in at /etc/nginx/conf.d/www-redirect.conf  (see ops/README-www-redirect.md).
#
# PREREQ: the TLS cert must cover www (run the certbot --expand step in the README
# FIRST). Until then the 443 block presents a cert that doesn't match www.
#
# IMPORTANT: before installing, confirm no EXISTING server block already lists
# `www.leadzap.com.my` in its server_name — if it does, remove it there first,
# otherwise nginx warns "conflicting server name" and ignores this block.

server {
    listen 80;
    listen [::]:80;
    server_name www.leadzap.com.my;
    return 301 https://leadzap.com.my$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.leadzap.com.my;

    ssl_certificate     /etc/letsencrypt/live/leadzap.com.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leadzap.com.my/privkey.pem;

    return 301 https://leadzap.com.my$request_uri;
}
