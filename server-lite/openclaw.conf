# Reverse-proxy the local Codex wrapper (server-lite) through the existing
# leadzap.com.my TLS server block, so Supabase Edge Functions can reach it.
# Included inside the 443 server block by setup-nginx.sh.
location /openclaw/ {
    proxy_pass http://127.0.0.1:18789/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
}
location /openclaw-sidecar/ {
    proxy_pass http://127.0.0.1:8790/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
}
