  <script>
    let gtagLoaded = false;
    function loadGtag() {
      if (gtagLoaded) return;
      gtagLoaded = true;

      const script = document.createElement('script');
      script.src = 'https://www.googletagmanager.com/gtag/js?id=G-E2SQMZG9DY';
      script.async = true;
      document.head.appendChild(script);

      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-E2SQMZG9DY');

      // 移除所有监听器
      ['scroll', 'mousemove', 'touchstart', 'keydown'].forEach((event) => {
        window.removeEventListener(event, loadGtag);
      });
    }

    // 监听交互行为
    ['scroll', 'mousemove', 'touchstart', 'keydown'].forEach((event) => {
      window.addEventListener(event, loadGtag, { passive: true, once: true });
    });

    // 兜底策略：如果用户没操作，5秒后也强制加载，确保数据统计完整性
    setTimeout(loadGtag, 5000);
  </script>
