<style>:root{--gold:#FCDF69;--ink:#FEF3C8;--mut:#A6A6A6;--bg:#121212;--card:#1a1a1a;--line:#2e2e2e}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 34px;max-width:400px;width:100%;text-align:center}
img{height:46px;margin-bottom:22px}
h1{font-size:21px;font-weight:800;margin-bottom:6px}p{color:var(--mut);font-size:13.5px;margin-bottom:22px;line-height:1.5}
input{width:100%;background:#121212;border:1px solid var(--line);border-radius:12px;color:var(--ink);font-family:inherit;
font-size:16px;letter-spacing:2px;text-align:center;text-transform:uppercase;padding:14px;outline:none}
input:focus{border-color:rgba(252,223,105,.6)}
button{width:100%;margin-top:14px;border:none;border-radius:12px;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;
padding:14px;background:linear-gradient(135deg,var(--gold),#D9B24E);color:#121212}
button:disabled{opacity:.5;cursor:not-allowed}.err{color:#ff8f8f;font-size:13px;margin-top:12px;min-height:18px}
.foot{margin-top:20px;color:var(--mut);font-size:11.5px}.foot a{color:var(--gold);text-decoration:none}</style></head>
