<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Vision × Leadzap — Onboarding</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--gold:#FCDF69;--ink:#FEF3C8;--mut:#A6A6A6;--bg:#121212;--card:#1a1a1a;--line:#2e2e2e}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 30px;max-width:460px;width:100%;text-align:center}
.logo{height:46px;margin-bottom:22px}
h1{font-size:21px;font-weight:800;margin-bottom:6px}
p.lead{color:var(--mut);font-size:13.5px;margin-bottom:26px;line-height:1.5}
.code{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:nowrap}
.pre{font-size:19px;font-weight:800;color:var(--gold);letter-spacing:1px;margin-right:3px}
.dash{color:var(--mut);font-weight:700;font-size:18px;padding:0 1px}
.box{width:38px;height:50px;background:#121212;border:1.5px solid var(--line);border-radius:10px;color:var(--ink);
font-family:inherit;font-size:21px;font-weight:700;text-align:center;text-transform:uppercase;outline:none;padding:0;
transition:border-color .15s,background .15s;caret-color:var(--gold)}
.box:focus{border-color:var(--gold);background:rgba(252,223,105,.07)}
.box.filled{border-color:rgba(252,223,105,.5)}
@media(max-width:420px){.box{width:32px;height:44px;font-size:18px}.code{gap:5px}.pre{font-size:17px}}
.card.bad .box{border-color:#ff8f8f;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
button{width:100%;margin-top:22px;border:none;border-radius:12px;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;
padding:14px;background:linear-gradient(135deg,var(--gold),#D9B24E);color:#121212}
button:disabled{opacity:.5;cursor:not-allowed}
.err{color:#ff8f8f;font-size:13px;margin-top:14px;min-height:18px}
.foot{margin-top:18px;color:var(--mut);font-size:11.5px}.foot a{color:var(--gold);text-decoration:none}</style></head>

<img class="logo" src="/onboarding/myvision/leadzap-logo.png" alt="Leadzap">

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(code){
 const enc=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const ct=b64(B.d),tag=b64(B.t);
 const buf=new Uint8Array(ct.length+tag.length);buf.set(ct);buf.set(tag,ct.length);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.i)},key,buf);
 return new TextDecoder().decode(pt);
}
const boxes=[].slice.call(document.querySelectorAll('.box'));
const btn=document.getElementById('go'),err=document.getElementById('e'),card=document.getElementById('card');
function assembled(){var v=boxes.map(function(b){return b.value.trim().toUpperCase();});
  return v.every(function(x){return x;})?('MV-'+v.slice(0,4).join('')+'-'+v.slice(4).join('')):null;}
function paint(){boxes.forEach(function(b){b.classList.toggle('filled',!!b.value);});}
function fill(text){
 var clean=text.toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^MV/,'');
 boxes.forEach(function(b,i){b.value=clean[i]||'';});
 paint();
 boxes[Math.min(clean.length,7)].focus();
 if(clean.length>=8) go();
}
boxes.forEach(function(b,i){
 b.addEventListener('input',function(){
   b.value=b.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,1);
   paint(); card.classList.remove('bad'); err.textContent='';
   if(b.value && i<7) boxes[i+1].focus();
   if(assembled()) go();
 });
 b.addEventListener('keydown',function(e){
   if(e.key==='Backspace' && !b.value && i>0){ boxes[i-1].value=''; boxes[i-1].focus(); paint(); e.preventDefault(); }
   if(e.key==='ArrowLeft' && i>0){ boxes[i-1].focus(); e.preventDefault(); }
   if(e.key==='ArrowRight' && i<7){ boxes[i+1].focus(); e.preventDefault(); }
   if(e.key==='Enter') go();
 });
 b.addEventListener('paste',function(e){ e.preventDefault(); fill((e.clipboardData||window.clipboardData).getData('text')); });
 b.addEventListener('focus',function(){ b.select(); });
});
async function go(){
 var code=assembled();
 if(!code){ err.textContent='Enter all 8 characters.'; return; }
 btn.disabled=true; err.textContent=''; btn.textContent='Unlocking…';
 try{
   var html=await unlock(code);
   sessionStorage.setItem('mv-unlocked','1');
   document.open();document.write(html);document.close();
 }catch(ex){
   card.classList.add('bad');
   err.textContent='That code didn\'t work. Check it and try again.';
   btn.disabled=false; btn.textContent='Unlock';
   boxes.forEach(function(b){b.value='';}); paint(); boxes[0].focus();
 }
}
btn.onclick=go;
boxes[0].focus();
</script></body></html>
